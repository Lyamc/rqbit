<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rqbit (GPUI)</title>
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1f22; }
      canvas { display: block; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                 color: #9da0a6; font: 14px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="loading">Loading rqbit (GPUI / WebAssembly)…</div>
    <script type="module">
      import init from "./rqbit_gpui_web.js";
      init({ module_or_path: "./rqbit_gpui_web_bg.wasm" })
        .then(() => document.getElementById("loading")?.remove())
        .catch((e) => {
          document.getElementById("loading").textContent = "Failed to start: " + e;
          console.error(e);
        });
    </script>
  </body>
</html>
