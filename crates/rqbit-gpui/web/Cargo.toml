# Browser (wasm32) build of the rqbit GPUI client.
#
# This is a separate workspace on purpose: it uses GPUI from zed's git
# repository (which has the web platform, `gpui_web`), while the native client
# and the rest of rqbit keep using gpui from crates.io. Build with ./build.sh.
[package]
name = "rqbit-gpui-web"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rqbit-gpui = { path = "..", features = ["gpui-main"] }
gpui = "0.2.2"
log = "0.4"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { git = "https://github.com/zed-industries/zed", rev = "933d8d93819c749a607e561883855a9b95c79cea", default-features = false }
wasm-bindgen = "=0.2.120"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = ["Window", "Location"] }

[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", rev = "933d8d93819c749a607e561883855a9b95c79cea", version = "=0.2.2" }
# Same patches as zed's own workspace.
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = false
panic = "abort"
