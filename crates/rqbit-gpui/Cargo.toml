[package]
name = "rqbit-gpui"
version.workspace = true
edition = "2024"
description = "Native desktop client for rqbit built on GPUI. Talks to an rqbit server over its HTTP API."
license = "Apache-2.0"
repository = "https://github.com/ikatson/rqbit"
publish = false

# This crate is only compiled when the `gpui` feature of the `rqbit` crate is
# enabled (or when built directly with `cargo build -p rqbit-gpui`). It is
# deliberately NOT in the workspace `default-members`, so a plain
# `cargo build` / `cargo test` in the workspace root never pulls in GPUI.

[features]
default = []
# Build against gpui from zed's git main (used by the wasm build in ./web).
gpui-main = []
# TLS for talking to https:// servers from the standalone `rqbit-gpui` binary.
# When built as part of `rqbit --features gpui` the TLS backend selected for
# librqbit (default-tls / rust-tls) is shared automatically.
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
# Native builds use GPUI 0.2.2 from crates.io. The browser build
# (crates/rqbit-gpui/web) patches this to zed's main branch, which has the
# wasm32 web platform (gpui_web).
gpui = "0.2.2"
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
url.workspace = true
log = "0.4"
futures.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
clap = { workspace = true, features = ["derive", "env"] }
reqwest = { workspace = true, features = ["blocking"] }

[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1"

[[bin]]
name = "rqbit-gpui"
path = "src/main.rs"
